description: webrtc_bridge
version: "0.0.2"

dependencies:
  esp_webrtc_utils:
    path: ../esp_webrtc_utils
    version: "*"

  # Both roles take their peer-data API from this one component; the role is a
  # Kconfig choice. Linux stays excluded — esp_hosted lists no linux target.
  espressif/esp_hosted:
    # Any 3.1.x from 3.1.0. The examples pin the exact version.
    version: "~3.1.0"
    rules:
      - if: "target not in [linux]"
