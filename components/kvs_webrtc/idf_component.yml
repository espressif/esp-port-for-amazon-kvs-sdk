dependencies:
  esp_webrtc_utils:
    path: ../esp_webrtc_utils
    version: "*"

  # >=2.8.0~1 carries the mbedTLS 4 / PSA crypto backend (esp-protocols#1114),
  # needed on ESP-IDF v6; major pinned to 2 (the 3.x line renames the library).
  espressif/libsrtp: ">=2.8.0~1,<3.0.0"

  esp_usrsctp:
    path: ../esp_usrsctp
    version: "*"

  kvs_utils:
    path: ../kvs_utils
    version: "*"
    public: true

  credential:
    path: ../credential
    version: "*"

  state_machine:
    path: ../state_machine
    version: "*"

  libwebsockets:
    path: ../libwebsockets
    version: "*"

  media_stream:
    path: ../media_stream
    version: "*"

  app_webrtc:
    path: ../app_webrtc
    version: "*"

  espressif/esp_websocket_client:
    version: "*"
