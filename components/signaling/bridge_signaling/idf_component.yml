dependencies:
  webrtc_bridge:
    path: ${KVS_SDK_PATH}/components/webrtc_bridge
    version: '*'

  signaling_serializer:
    path: ${KVS_SDK_PATH}/components/signaling_serializer
    version: '*'

  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: '*'

  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: '*'

  espressif/esp_hosted:
    # Any 3.1.x from 3.1.0. The examples pin the exact version.
    version: "~3.1.0"
    rules:
      - if: "target in [esp32p4]"
