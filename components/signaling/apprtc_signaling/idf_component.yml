dependencies:
  # IDF v6 dropped the bundled `json` (cJSON) component; pull the registry
  # cJSON instead (works on v5.4/v5.5 too — the REQUIRES "json" is gone).
  espressif/cjson: "*"

  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: '*'

  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: '*'

  signaling_serializer:
    path: ${KVS_SDK_PATH}/components/signaling_serializer
    version: '*'

  espressif/esp_websocket_client:
    version: '*'

  media_stream:
    path: ${KVS_SDK_PATH}/components/media_stream
    version: '*'
