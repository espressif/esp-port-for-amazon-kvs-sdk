## IDF Component Manager Manifest File
dependencies:
  idf:
    version: ">=4.4.0"
  ## Required IDF components
  esp_websocket_client: "*"

  libwebsockets:
    path: ../../libwebsockets
    version: '*'

  credential:
    path: ../../credential
    version: '*'

  kvs_utils:
    path: ../../kvs_utils
    version: '*'

  state_machine:
    path: ../../state_machine
    version: '*'

  # Header-only: the upstream KVS SDK's shared Include_i.h (#include
  # <srtp2/srtp.h>) is compiled into the signaling sources, so srtp2/srtp.h
  # must be on the include path even though signaling uses no SRTP itself.
  espressif/libsrtp: "2.8.*"

  esp_usrsctp:
    path: ../../esp_usrsctp
    version: '*'

  esp_webrtc_utils:
    path: ../../esp_webrtc_utils
    version: '*'

  app_webrtc:
    path: ../../app_webrtc
    version: '*'
