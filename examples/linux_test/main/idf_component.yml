## IDF Component Manager Manifest File
##
## Linux-target equivalent of webrtc_classic. Only components whose APIs
## main.c directly calls are listed here — kvs_utils, libsrtp, esp_usrsctp,
## libwebsockets, state_machine, credential all flow transitively through
## these four (identical layout to the ESP webrtc_classic example, minus the
## ESP-only camera/BSP/slave-flasher deps which the components gate off linux).
dependencies:
  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"
  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: "*"
  # grouped signaling layout on this branch (components/signaling/…)
  kvs_signaling:
    path: ${KVS_SDK_PATH}/components/signaling/kvs_signaling
    version: "*"
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"
  # File-backed H.264 + Opus capture (the upstream SDK's sample frames), shared
  # with any example that has a linux-target branch.
  file_capture:
    path: ${KVS_SDK_PATH}/examples/common_components/file_capture
    version: "*"
