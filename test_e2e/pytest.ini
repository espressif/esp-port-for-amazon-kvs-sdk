[pytest]
python_files = pytest_*.py
addopts = --embedded-services esp,idf --tb short

# The measured numbers (packet loss, candidate pair, first-frame latency) are the
# point of these tests -- they are what you compare across an esp_hosted bump. Without
# log_cli they are swallowed by pytest's capture even under -s.
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)-7s %(name)s: %(message)s
markers =
    e2e: end-to-end streaming test, needs real hardware + Wi-Fi + AWS credentials
norecursedirs = managed_components build .*
