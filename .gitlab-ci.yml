stages:
  - test
  - build
  - docs

variables:
  V: "0"
  MAKEFLAGS: "-j8 --no-keep-going"
  GIT_SUBMODULE_STRATEGY: recursive

# The runner's own submodule checkout can fail part way (its mirror fetch is
# refused) and its retry does not recurse, which leaves nested submodules such as
# esp_hosted's protobuf-c empty. Make every job start from a complete checkout.
default:
  before_script:
    - git submodule sync --recursive
    - git submodule update --init --recursive

# The nightly lws canary schedule sets LWS_CANARY=1 and wants only build_lws_upstream.
# Every other job opts out of it here. except (not rules) keeps their default of
# branch and tag pipelines; a catch-all rule would also start merge-request pipelines.
.not_in_lws_canary:
  except:
    variables:
      - $LWS_CANARY

.apply_sdk_patches: &apply_sdk_patches
  - echo "Applying SDK patches to WebRTC SDK submodule..."
  - cd $CI_PROJECT_DIR/amazon-kinesis-video-streams-webrtc-sdk-c
  # Inject identity so `git am` doesn't bail on a runner without one.
  - git -c user.email=ci@espressif.local -c user.name='CI Patch Apply' am $CI_PROJECT_DIR/patches/*.patch
  - cd $CI_PROJECT_DIR

.build_examples: &build_examples
  - apt-get update && apt-get install -y pkg-config
  - *apply_sdk_patches
  - for TARGET in $TARGETS; do
  - for EXAMPLE in $EXAMPLES; do
  - if [ $EXAMPLE == "network_adapter" ] && [ $TARGET != "esp32c6" ] && [ $TARGET != "esp32c5" ]; then
  - echo "Skipping $EXAMPLE for $TARGET (network_adapter only for esp32c6/esp32c5)"
  - continue
  - fi
  - if [ $EXAMPLE == "signaling_only" ] && [ $TARGET == "esp32p4" ]; then
  - echo "Skipping $EXAMPLE for $TARGET (P4 has no Wi-Fi/BLE — runs C6 network_adapter instead)"
  - continue
  - fi
  # streaming_only is the split-mode P4 host (HW H.264 encoder + esp_video
  # MIPI-CSI). It has no meaning on the C-series or plain ESP32.
  - if [ $EXAMPLE == "streaming_only" ] && [ $TARGET != "esp32p4" ]; then
  - echo "Skipping $EXAMPLE for $TARGET (split-mode host — esp32p4 only)"
  - continue
  - fi
  # simple_video_server is the P4 camera HTTP-server demo (esp_video MIPI-CSI).
  - if [ $EXAMPLE == "simple_video_server" ] && [ $TARGET != "esp32p4" ]; then
  - echo "Skipping $EXAMPLE for $TARGET (camera HTTP server — esp32p4 only)"
  - continue
  - fi
  # webrtc_person_detect needs the raw-frame bus (esp_video capture) and esp-dl: the
  # P4 with its hardware encoder and PPA, or the S3 with the software ones.
  - if [ $EXAMPLE == "webrtc_person_detect" ] && [ $TARGET != "esp32p4" ] && [ $TARGET != "esp32s3" ]; then
  - echo "Skipping $EXAMPLE for $TARGET (esp_video capture + esp-dl - esp32p4 and esp32s3 only)"
  - continue
  - fi
  - example_path=$CI_PROJECT_DIR/examples/$EXAMPLE
  - cd $example_path
  # person_detect on the S3 is the ESP32-S3-EYE: without its overlay the S3 BSP has no camera.
  - DEFAULTS_ARG=""
  - if [ $EXAMPLE == "webrtc_person_detect" ] && [ $TARGET == "esp32s3" ]; then
  - DEFAULTS_ARG="-D SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.s3_eye.esp32s3"
  - fi
  - echo "Building $EXAMPLE for $TARGET $DEFAULTS_ARG"
  - idf.py $DEFAULTS_ARG set-target $TARGET
  - idf.py build
  - mkdir -p $CI_PROJECT_DIR/build_output/$EXAMPLE/$TARGET/
  - cp $example_path/build/*.bin $CI_PROJECT_DIR/build_output/$EXAMPLE/$TARGET/
  - cp $example_path/build/*.elf $CI_PROJECT_DIR/build_output/$EXAMPLE/$TARGET/
  - cp $example_path/build/*.map $CI_PROJECT_DIR/build_output/$EXAMPLE/$TARGET/
  - rm -rf build sdkconfig
  - done
  - done
  - cd $CI_PROJECT_DIR

# Host unit tests (Unity) for the platform-agnostic helpers. Runs on the Linux
# target — fast, no hardware — and fails the pipeline on any Unity failure.
test_host:
  extends: .not_in_lws_canary
  stage: test
  tags:
    - build
  image: espressif/idf:release-v5.5
  artifacts:
    when: always
    reports:
      junit: test_app/report.xml
    expire_in: 1 mos
  script:
    - pip install pytest-embedded pytest-embedded-idf
    - cd $CI_PROJECT_DIR/test_app
    - idf.py --preview -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.linux" set-target linux
    - idf.py build
    # Linux host target: use only the `idf` service. pytest.ini defaults to
    # `esp,idf` for on-hardware runs; the `esp` serial service isn't needed on
    # the host and pulls pytest-embedded-serial-esp, which the image lacks.
    - pytest pytest_kvs_webrtc.py --target linux --embedded-services idf --junitxml=$CI_PROJECT_DIR/test_app/report.xml

# Examples with a linux-target branch, built for the host so shared-code changes
# cannot break the host build unnoticed.
build_linux_examples:
  extends: .not_in_lws_canary
  stage: build
  tags:
    - build
  image: espressif/idf:release-v5.5
  script:
    - apt-get update && apt-get install -y pkg-config
    - *apply_sdk_patches
    - cd $CI_PROJECT_DIR/examples/linux_test
    - idf.py --preview set-target linux
    - idf.py build
    - cd $CI_PROJECT_DIR/examples/esp_camera
    - idf.py --preview -D SDKCONFIG_DEFAULTS=sdkconfig.defaults.linux set-target linux
    - idf.py build

.build_template:
  extends: .not_in_lws_canary
  stage: build
  tags:
    - build
  artifacts:
    paths:
      - build_output/
    expire_in: 6 mos
  script:
    - *build_examples

# One job per target: the combined v5.5 job hit the 60-minute runner cap.
# TARGETS stays list-valued, so .build_examples and its skip rules are unchanged.
build_idf_v5.4:
  extends: .build_template
  image: espressif/idf:release-v5.4
  parallel:
    matrix:
      - TARGETS: [esp32, esp32s3, esp32c6, esp32p4]
  variables:
    EXAMPLES: webrtc_classic esp_camera signaling_only streaming_only network_adapter simple_video_server webrtc_person_detect

build_idf_v5.5:
  extends: .build_template
  image: espressif/idf:release-v5.5
  parallel:
    matrix:
      - TARGETS: [esp32, esp32s3, esp32c6, esp32c5, esp32p4]
  variables:
    EXAMPLES: webrtc_classic esp_camera signaling_only streaming_only network_adapter simple_video_server webrtc_person_detect

# IDF v6.x ships mbedTLS 4 (TF-PSA-Crypto). The SDK crypto adapts to it via PSA and
# the port stays on libsrtp 2.x, which speaks mbedTLS 4 from 2.8.0~1 onward
# (esp-protocols#1114).
build_idf_v6.0:
  extends: .build_template
  image: espressif/idf:release-v6.0
  parallel:
    matrix:
      - TARGETS: [esp32, esp32s3, esp32c6, esp32c5, esp32p4]
  variables:
    EXAMPLES: webrtc_classic esp_camera signaling_only streaming_only network_adapter simple_video_server webrtc_person_detect

build_idf_v6.1:
  extends: .build_template
  image: espressif/idf:release-v6.1
  parallel:
    matrix:
      - TARGETS: [esp32, esp32s3, esp32c6, esp32c5, esp32p4]
  variables:
    EXAMPLES: webrtc_classic esp_camera signaling_only streaming_only network_adapter simple_video_server webrtc_person_detect

# Feature-combination builds: valid Kconfig combinations that the main matrix
# never exercises (it builds full-featured defaults only). One board is enough
# — these guard against gating regressions, not board coverage.
build_feature_combos:
  extends: .not_in_lws_canary
  stage: build
  tags:
    - build
  image: espressif/idf:release-v5.5
  script:
    - apt-get update && apt-get install -y pkg-config
    - *apply_sdk_patches
    - cd $CI_PROJECT_DIR/examples/webrtc_classic
    # Stub co-processor images for the slave_* combos; they only have to build.
    - mkdir -p /tmp/slave_stub && for f in bootloader partition-table app; do head -c 4096 /dev/urandom > /tmp/slave_stub/$f.bin; done
    # Each combo is a committed sdkconfig fragment (sdkconfig.ci.*) appended
    # to the default esp32p4 chain; one board is enough for the gating checks.
    - for COMBO in noglib no_player no_dc player_headless lws slave_embedded slave_spiffs; do
    -   idf.py -B build_combo -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32p4;sdkconfig.ci.$COMBO" set-target esp32p4
    -   idf.py -B build_combo build
    -   rm -rf build_combo sdkconfig dependencies.lock
    - done

# The e2e and emulator overlay chains (test_e2e/README.md) are otherwise built only
# by hand on a bench, so a Kconfig rename could break them unnoticed. Build-only: the
# tests themselves need hardware or esp-emu, and AWS. The credentials fragment holds
# dummy values; the build needs only the symbols.
build_e2e_configs:
  extends: .not_in_lws_canary
  stage: build
  tags:
    - build
  image: espressif/idf:release-v5.5
  script:
    - apt-get update && apt-get install -y pkg-config
    - *apply_sdk_patches
    - printf '%s\n' 'CONFIG_IOT_CORE_ENABLE_CREDENTIALS=n' 'CONFIG_AWS_ACCESS_KEY_ID="ci-dummy"' 'CONFIG_AWS_SECRET_ACCESS_KEY="ci-dummy"' > /tmp/ci_dummy.creds
    # example:target:overlays -- overlays are sdkconfig.ci.<name>, comma-separated,
    # appended to the per-target defaults in the order the README gives.
    - |
      set -e
      for SPEC in webrtc_classic:esp32p4:e2e webrtc_classic:esp32p4:e2e,emu webrtc_classic:esp32p4:e2e,emu,playermem,player_headless streaming_only:esp32p4:e2e,emu signaling_only:esp32c6:e2e,emu; do
        IFS=: read EXAMPLE TARGET OVERLAYS <<< "$SPEC"
        DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.$TARGET"
        for O in ${OVERLAYS//,/ }; do DEFAULTS="$DEFAULTS;sdkconfig.ci.$O"; done
        cd $CI_PROJECT_DIR/examples/$EXAMPLE
        echo "Building $EXAMPLE for $TARGET with $DEFAULTS"
        idf.py -B build_e2e -D "SDKCONFIG_DEFAULTS=$DEFAULTS;/tmp/ci_dummy.creds" set-target $TARGET
        idf.py -B build_e2e build
        rm -rf build_e2e sdkconfig dependencies.lock
      done

# Collection only, with no device: every test skips without --e2e or --emu, but an
# import error or a broken fixture still fails here instead of on the bench.
test_e2e_collect:
  extends: .not_in_lws_canary
  stage: test
  tags:
    - build
  image: python:3.11
  script:
    - pip install -r test_e2e/requirements.txt
    - pytest --collect-only -q test_e2e

# webrtc_classic on libwebsockets signaling, built from the pinned submodule. The
# main matrix never links lws on a target (USE_ESP_WEBSOCKET_CLIENT defaults to y),
# and build_feature_combos' lws combo runs on v5.5 only, so this is the blocking
# check for the IDF v6 errno handling in components/libwebsockets/CMakeLists.txt.
.webrtc_classic_lws: &webrtc_classic_lws
  - cd $CI_PROJECT_DIR/examples/webrtc_classic
  - DEFAULTS="sdkconfig.defaults"
  - if [ -f sdkconfig.defaults.$TARGET ]; then DEFAULTS="$DEFAULTS;sdkconfig.defaults.$TARGET"; fi
  - idf.py -B build_lws -D "SDKCONFIG_DEFAULTS=$DEFAULTS;sdkconfig.ci.lws" set-target $TARGET
  - idf.py -B build_lws build

build_lws_idf_v6:
  extends: .not_in_lws_canary
  stage: build
  tags:
    - build
  parallel:
    matrix:
      - IDF_IMAGE: [release-v6.0, release-v6.1]
        TARGET: esp32p4
  image: espressif/idf:$IDF_IMAGE
  script:
    - apt-get update && apt-get install -y pkg-config
    - *apply_sdk_patches
    - *webrtc_classic_lws

# Canary: webrtc_classic on libwebsockets signaling against warmcat/libwebsockets main
# HEAD rather than the pinned submodule, so an upstream change that breaks this port's
# lws configuration shows up before the pin is bumped. Schedules and manual runs only,
# and never blocking: upstream main is not ours to keep green. Its nightly schedule
# sets LWS_CANARY=1, so that pipeline runs this job alone.
build_lws_upstream:
  stage: build
  tags:
    - build
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
  parallel:
    matrix:
      - IDF_IMAGE: release-v5.5
        TARGET: esp32s3
      - IDF_IMAGE: release-v6.0
        TARGET: esp32p4
  image: espressif/idf:$IDF_IMAGE
  script:
    - apt-get update && apt-get install -y pkg-config
    - *apply_sdk_patches
    - git -C components/libwebsockets/libwebsockets fetch --depth 1 origin main
    - git -C components/libwebsockets/libwebsockets checkout --detach FETCH_HEAD
    - echo "libwebsockets main at $(git -C components/libwebsockets/libwebsockets log -1 --format='%h %cd %s' --date=short)"
    - *webrtc_classic_lws

build_docs:
  extends: .not_in_lws_canary
  stage: docs
  image: python:3.11
  # The docs build needs no submodules; skip the default recursive checkout.
  before_script: []
  tags:
    - build
  artifacts:
    paths:
      - docs/_build/
    expire_in: 6 mos
  script:
    # esp_docs.esp_extensions.run_doxygen invokes `doxygen` directly;
    # sphinxcontrib-plantuml invokes the real Java `plantuml` binary
    # with `-pipe -charset -tsvg` flags — the pip `plantuml` python
    # wrapper doesn't accept those. Install both system tools.
    - apt-get update && apt-get install -y --no-install-recommends doxygen plantuml
    - pip install -r docs/requirements.txt
    - cd docs
    - build-docs -l en -t esp32
